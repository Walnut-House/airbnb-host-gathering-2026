<style>

  main.phone{max-width:560px;padding:12px 0;gap:12px}
  img{display:block;width:100%;height:auto;box-shadow:0 1px 3px rgba(0,0,0,.08)}

</head>

function phone(){return st.vw=="phone"||(st.vw=="auto"&&matchMedia("(max-width: 760px)").matches)}
function draw(){
  const p=phone(), m=document.getElementById("m"); m.className=p?"phone":"";
  const dir=st.ed=="detail"?(p?"m/slides":"slides"):(p?"m/summary":"summary/slides");
  m.innerHTML=D[st.ed].map((f,i)=>`<img src="${dir}/${f}" alt="${i+1}쪽" loading="${i<2?"eager":"lazy"}"${p?"":' width="1920" height="1080"'}>`).join("");
  for(const g of ["ed","vw"]) document.querySelectorAll(`#${g} button`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.v==st[g]));
}
document.querySelectorAll("#ed button").forEach(b=>b.onclick=()=>{st.ed=b.dataset.v;history.replaceState(null,"","?ed="+st.ed);draw();scrollTo(0,0)});
document.querySelectorAll("#vw button").forEach(b=>b.onclick=()=>{st.vw=b.dataset.v;localStorage.setItem("vw",st.vw);draw();scrollTo(0,0)});
matchMedia("(max-width: 760px)").addEventListener("change",draw);
draw();
</script>
</body>
</html>
